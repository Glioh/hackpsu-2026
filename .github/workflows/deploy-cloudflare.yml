name: Deploy game to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test game and validate Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false
      - name: Record exact source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Worker without deploying or building containers
        run: npx wrangler deploy --dry-run --containers-rollout=none --outdir .deployment/cloudflare

  deploy:
    name: Deploy tested commit to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          missing=0
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Missing CLOUDFLARE_API_TOKEN. Add it as a repository Actions secret.'
            missing=1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it as a repository Actions secret or variable.'
            missing=1
          fi
          if [[ "$missing" == 1 ]]; then
            echo 'Deployment is blocked by missing Cloudflare credentials. Game tests and Worker validation passed.' >> "$GITHUB_STEP_SUMMARY"
            echo "Configure credentials: https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions" >> "$GITHUB_STEP_SUMMARY"
            echo 'See docs/cloudflare-deploy.md for token permissions and account setup.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character account ID, not an email, zone ID, or dashboard URL.'
            exit 1
          fi
      - name: Check out the exact tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and deploy Worker and game container
        run: npx wrangler deploy --var "APP_COMMIT:$(git rev-parse HEAD)"
      - name: Record deployed commit
        shell: bash
        run: |
          echo "Deployed commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'The stable workers.dev URL is printed in the deployment log. Its /health endpoint reports the deployed commit.' >> "$GITHUB_STEP_SUMMARY"
