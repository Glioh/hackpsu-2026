name: Deploy game to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare configuration
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Settings > Secrets and variables > Actions. See docs/cloudflare-deploy.md.'
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Build and deploy Worker and game container
        run: npx wrangler deploy --var "APP_COMMIT:$(git rev-parse HEAD)"
      - name: Record deployed commit
        shell: bash
        run: |
          echo "Deployed commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'The stable workers.dev URL is printed in the deployment log. Its /health endpoint reports the deployed commit.' >> "$GITHUB_STEP_SUMMARY"
